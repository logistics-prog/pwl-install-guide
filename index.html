<style>
  :root{
    --bg:#ffffff; --card:#fff; --ink:#20201d; --sub:#84867f;
    --line:#e8e8e6; --tag:#26241f; --accent:#8a6d3b; --shadow:0 1px 2px rgba(0,0,0,.04);
    --panel:#f5fbf6; --panel-line:#e9f2ea; --stage:#eef7f0;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:Pretendard,system-ui,"Apple SD Gothic Neo",sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  header{position:sticky;top:0;z-index:5;background:var(--bg);
    padding:16px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .logo{width:26px;height:26px;object-fit:contain;display:block}
  .home{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;cursor:pointer}
  header b{font-size:15px}
  .menu-btn{margin-left:auto;background:none;border:1px solid var(--line);border-radius:10px;
    width:40px;height:36px;display:grid;place-items:center;cursor:pointer;color:var(--ink);font-size:17px}
  .menu-btn:hover{background:#fff}
  .hero{max-width:1040px;margin:0 auto;padding:44px 24px 8px;text-align:center}
  .hero h1{font-size:37px;margin:0 0 12px;letter-spacing:-.02em;text-wrap:balance}
  .hero h1 span{color:var(--accent)}
  .hero p{color:var(--sub);margin:0 auto;max-width:600px;font-size:16px}
  .search{margin:24px auto 0;max-width:480px;width:100%}
  .search input{width:100%;padding:12px 16px;border:1px solid var(--line);border-radius:26px;
    background:#fff;font:inherit;color:inherit;outline:none}
  .search input:focus{border-color:var(--accent)}
  /* 카테고리 드로어 */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;visibility:hidden;
    transition:opacity .25s;z-index:20}
  .scrim.open{opacity:1;visibility:visible}
  .drawer{position:fixed;top:0;right:0;height:100%;width:250px;max-width:80vw;background:#fff;
    box-shadow:-6px 0 24px rgba(0,0,0,.12);transform:translateX(100%);transition:transform .28s ease;
    z-index:21;padding:18px 16px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
  .drawer.open{transform:translateX(0)}
  .drawer .cat-head{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
  .drawer .close{align-self:flex-end;border:none;background:none;font-size:24px;line-height:1;
    color:var(--sub);cursor:pointer;padding:2px 6px}
  .drawer h4{margin:2px 6px 12px;font-size:12px;letter-spacing:.1em;color:var(--sub)}
  .drawer a{padding:12px 14px;border-radius:12px;text-decoration:none;color:var(--ink);
    font-weight:600;font-size:15px;cursor:pointer;transition:background .12s;display:flex;
    justify-content:space-between;align-items:center}
  .drawer a:hover{background:var(--bg)}
  .drawer a.active{background:var(--tag);color:#fff}
  .drawer a .n{font-size:12px;font-weight:600;opacity:.6}
  /* 활성 필터 칩 */
  .filterbar{max-width:1040px;margin:0 auto;padding:4px 24px 0;text-align:center}
  .chip{display:inline-flex;align-items:center;gap:7px;background:var(--tag);color:#fff;
    border:none;border-radius:20px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;margin:0 4px}
  main{max-width:1040px;margin:0 auto;padding:8px 24px 60px}
  .sec-head{display:flex;align-items:baseline;gap:10px;margin:34px 0 16px}
  .sec-head h2{font-size:20px;margin:0}
  .sec-head .count{background:var(--line);color:var(--sub);font-size:12px;font-weight:700;
    border-radius:20px;padding:2px 9px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:18px}
  /* 브랜드 랜딩 */
  .brandgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(224px,1fr));gap:16px}
  .brandcard{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;
    cursor:pointer;text-align:center;font:inherit;color:inherit;padding:0;
    transition:transform .15s,box-shadow .15s,border-color .15s}
  .brandcard:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(0,0,0,.08);border-color:#c9d6c9}
  .brandcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .bc-logo{background:#fff;height:118px;display:flex;align-items:center;justify-content:center;padding:16px}
  .bc-svg{width:70%;height:auto;max-height:42px}
  .wm{color:#1a1a1a;font-family:Pretendard,system-ui,sans-serif}
  .wm-serif{font-family:Georgia,'Times New Roman',serif}
  .wm sup{font-size:.5em;vertical-align:super}
  .bc-meta{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;
    border-top:1px solid var(--line);font-size:14px;font-weight:700}
  .bc-n{color:var(--sub);font-size:12px;font-weight:600}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;
    box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s;
    text-decoration:none;color:inherit;display:flex;flex-direction:column}
  .card.link{cursor:pointer}
  .card.link:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(0,0,0,.08)}
  .card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .card-img{position:relative;aspect-ratio:4/3;background:#f1f3f1}
  .card-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .45s ease}
  .card-img .hover{opacity:0}
  .card:hover .card-img .hover{opacity:1}
  .tag{position:absolute;top:12px;left:12px;background:var(--tag);color:#fff;font-size:11px;
    font-weight:700;padding:5px 11px;border-radius:20px;letter-spacing:.02em}
  .body{padding:16px 16px 4px;flex:1}
  .brand{font-size:12px;color:var(--sub);font-weight:600;letter-spacing:.04em}
  .body h3{margin:5px 0 8px;font-size:18px;letter-spacing:-.01em}
  .desc{color:var(--sub);font-size:13.5px;min-height:20px}
  .meta{display:flex;align-items:center;justify-content:space-between;
    border-top:1px solid var(--line);margin-top:12px;padding:11px 16px;font-size:13px;color:var(--sub)}
  .meta .arrow{font-size:16px;color:var(--ink)}
  .meta .soon{color:var(--accent);font-weight:600}
  .center{max-width:1040px;margin:60px auto;text-align:center;color:var(--sub);padding:0 24px}
  .spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--accent);
    border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 14px}
  @keyframes sp{to{transform:rotate(360deg)}}
  /* ===== 상세 페이지 ===== */
  .detail{max-width:900px;margin:0 auto;padding:28px 24px 70px}
  .crumb{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--sub);margin-bottom:16px}
  .crumb a{cursor:pointer;font-weight:600;color:var(--sub);text-decoration:none}
  .crumb a:hover{color:var(--ink)}
  .crumb i{font-style:normal;opacity:.5}
  .crumb span{color:var(--ink);font-weight:600}
  .dchip{display:inline-block;background:#fff;border:1px solid var(--line);color:var(--accent);
    font-size:12px;font-weight:700;letter-spacing:.04em;padding:6px 12px;border-radius:20px;margin-bottom:14px}
  .dtitle{font-size:34px;margin:0 0 12px;letter-spacing:-.02em;text-wrap:balance}
  .ddesc{color:var(--sub);font-size:16px;max-width:660px;margin:0 0 20px;line-height:1.7}
  .ddesc p{margin:0 0 12px}
  .ddesc p:last-child{margin-bottom:0}
  .dmeta{display:flex;flex-wrap:wrap;gap:22px;color:var(--sub);font-size:14px;margin-bottom:22px}
  .dmeta b{color:var(--ink);font-weight:700;margin-right:4px}
  .dbtns{display:flex;gap:10px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:7px;border-radius:24px;padding:11px 20px;
    font:inherit;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;border:1px solid var(--line);color:var(--ink)}
  .btn.dark{background:var(--tag);color:#fff;border-color:var(--tag)}
  .btn.ghost{background:#fff}
  .btn.disabled{opacity:.5;pointer-events:none}
  .drule{border:none;border-top:1px solid var(--line);margin:30px 0}
  .dbody{max-width:680px;margin:0 0 26px;color:var(--ink);font-size:15px;line-height:1.75}
  .dbody p{margin:0 0 14px}
  .dbody .bh{font-size:17px;margin:22px 0 10px}
  .dbody a{color:var(--accent);word-break:break-all}
  .pdfwrap{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
  .pdfwrap iframe{width:100%;height:72vh;border:0;display:block}
  .dback{margin-top:26px}
  /* ===== 시뮬레이션 ===== */
  .sim{background:var(--panel);border:1px solid var(--panel-line);border-radius:16px;padding:22px}
  .sim h3{margin:0 0 4px;font-size:18px}
  .sim .subt{color:var(--sub);font-size:13.5px;margin:0 0 16px}
  .sim-stage{position:relative;height:250px;max-width:520px;margin:0 auto;background:var(--stage);border-radius:14px;overflow:hidden}
  .sim-label{position:absolute;top:16px;left:0;right:0;text-align:center;font-size:13px;font-weight:700;color:var(--accent)}
  .mod{position:absolute;bottom:40px;width:40%;filter:drop-shadow(0 6px 10px rgba(0,0,0,.08))}
  .modR{left:50%}
  .modL{right:50%}
  .brk{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);text-align:center}
  .brk .cap{font-size:11px;color:var(--sub);margin-top:3px;font-weight:600}
  .glide{position:absolute;bottom:16px;right:4%;text-align:center}
  .glide .gsvg{width:34px}
  .glide .cap{font-size:11px;color:var(--accent);font-weight:600;margin-top:2px}
  .gfoot{transform-box:fill-box;transform-origin:center}
  .sim-steps{display:flex;gap:18px;flex-wrap:wrap;margin:16px 2px 0;color:var(--sub);font-size:13.5px}
  .sim-steps b{color:var(--ink)}
  .sim .replay{margin-top:14px}
  /* ===== 모듈 구성 ===== */
  .modguide{margin-top:26px;background:var(--panel);border:1px solid var(--panel-line);border-radius:16px;padding:22px}
  .modguide h3{margin:0 0 4px;font-size:18px}
  .modguide .subt{color:var(--sub);font-size:13.5px;margin:0 0 18px}
  .mg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:14px}
  .mg-card{border:1px solid var(--line);border-radius:12px;padding:12px 12px 14px;text-align:center;background:#fff}
  .mg-img{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;min-height:82px;
    display:flex;align-items:center;justify-content:center}
  .mg-svg{width:100%;height:auto;max-height:66px}
  .mg-name{margin-top:10px;font-size:14px;font-weight:700}
  .mg-sub{font-size:12px;color:var(--sub);margin-top:3px}
  /* ===== FAQ ===== */
  .faq{margin-top:26px;background:var(--panel);border:1px solid var(--panel-line);border-radius:16px;padding:22px}
  .faq h3{margin:0 0 14px;font-size:18px}
  .faq-item{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:#fff}
  .faq-item summary{padding:14px 42px 14px 16px;cursor:pointer;font-weight:600;font-size:15px;
    list-style:none;position:relative}
  .faq-item summary::-webkit-details-marker{display:none}
  .faq-item summary::after{content:'+';position:absolute;right:16px;top:12px;color:var(--sub);font-size:19px}
  .faq-item[open] summary::after{content:'\2212'}
  .faq-a{padding:2px 16px 15px;color:var(--ink);font-size:14px;line-height:1.7}
  .faq-a p{margin:0 0 10px}
  .faq-a a{color:var(--accent);word-break:break-all}
  .sim-stage.play .modL{animation:simDrop 1.2s cubic-bezier(.45,.05,.3,1) both}
  .sim-stage.play .brk{animation:simBrk .6s ease both;animation-delay:1.3s}
  .sim-stage.play .sim-label{animation:simLbl .6s ease both;animation-delay:1.35s}
  .sim-stage.play .glide{animation:simGlideIn .5s ease both;animation-delay:2.2s}
  .sim-stage.play .gfoot{animation:simGlide .8s ease 2.7s 2 both}
  @keyframes simDrop{0%{transform:translateY(-230px);opacity:0}14%{opacity:1}72%{transform:translateY(7px)}100%{transform:translateY(0)}}
  @keyframes simBrk{0%{opacity:0;transform:translateX(-50%) translateY(8px) scale(.7)}70%{opacity:1;transform:translateX(-50%) translateY(0) scale(1.08)}100%{opacity:1;transform:translateX(-50%) scale(1)}}
  @keyframes simLbl{0%{opacity:0}100%{opacity:1}}
  @keyframes simGlideIn{0%{opacity:0}100%{opacity:1}}
  @keyframes simGlide{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  @media (max-width:600px){.hero h1{font-size:30px}.hero p{font-size:15px}.dtitle{font-size:27px}}
</style>
</head>

<header>

<script>
// ===== 설정 =====
const SHEET_ID = '1paHLmKICvQ7EAlh07nir9-9BPW_VEHIzcesS4JRJ1LU';
const CATALOG_TAB = '카탈로그';   // 카탈로그 탭
const FAQ_TAB = 'FAQ';           // FAQ 탭 (열: 브랜드 아티클 질문 답변 순서)
// 열 헤더(순서 무관, 이름으로 인식): 브랜드 카테고리 아티클 이미지 hover 태그 설명 링크 순서 노출 상세 단계 소요 인원 공구
// ================

const csvUrl = tab => `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tab)}`;
const CSV_URL = csvUrl(CATALOG_TAB);
const view = document.getElementById('view');
let rows = [];
let faqRows = [];

// --- CSV 파서 (따옴표·줄바꿈 안전) ---
function parseCSV(text){
  const out=[]; let row=[], cur='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; }
      else cur+=c;
    } else {
      if(c==='"') q=true;
      else if(c===',') {row.push(cur);cur='';}
      else if(c==='\n'){row.push(cur);out.push(row);row=[];cur='';}
      else if(c==='\r'){}
      else cur+=c;
    }
  }
  if(cur!==''||row.length){row.push(cur);out.push(row);}
  return out;
}

function esc(s){return (s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
// 상세 본문: 빈 줄=문단, 줄바꿈=<br>, URL 자동링크, 줄머리 "# "=소제목
function fmtBody(t){
  const link = s => s.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  const lines = esc(t).replace(/\r/g,'').split('\n');
  let html='', buf=[];
  const flush = ()=>{ if(buf.length){ html+=`<p>${buf.join('<br>')}</p>`; buf=[]; } };
  lines.forEach(ln=>{
    if(/^#\s/.test(ln)){ flush(); html+=`<h3 class="bh">${link(ln.replace(/^#\s/,''))}</h3>`; }
    else if(ln.trim()===''){ flush(); }
    else buf.push(link(ln));
  });
  flush();
  return html;
}

function toObjects(grid){
  if(!grid.length) return [];
  const head = grid[0].map(h=>h.trim());
  const idx = name => head.findIndex(h=>h.replace(/\s/g,'').toLowerCase()===name.toLowerCase());
  const col = {
    brand:idx('브랜드'), cat:idx('카테고리'), name:idx('아티클'),
    img:idx('이미지'), hover:idx('hover'), tag:idx('태그'),
    desc:idx('설명'), link:idx('링크'), order:idx('순서'), show:idx('노출'),
    detail:idx('상세'),
    step:idx('단계'), time:idx('소요'), people:idx('인원'), tool:idx('공구'),
    simdesc:idx('시뮬설명'),
    ko1:idx('한글명1'), ko2:idx('한글명2')
  };
  const g = (r,k)=> col[k]>=0 ? (r[col[k]]||'').trim() : '';
  return grid.slice(1).map((r,i)=>({
    id:i,
    brand:g(r,'brand'), cat:g(r,'cat'), name:g(r,'name'),
    img:g(r,'img'), hover:g(r,'hover'), tag:g(r,'tag'),
    desc:g(r,'desc'), link:g(r,'link'), order:g(r,'order'), show:g(r,'show'),
    detail:g(r,'detail'),
    step:g(r,'step'), time:g(r,'time'), people:g(r,'people'), tool:g(r,'tool'),
    simdesc:g(r,'simdesc'),
    ko1:g(r,'ko1'), ko2:g(r,'ko2')
  })).filter(o=>o.name && o.show.toUpperCase()!=='N');
}

function cardHTML(o){
  const linkable = !!o.link;
  const imgBase = o.img
    ? `<img loading="lazy" alt="${esc(o.name)}" src="${esc(o.img)}">`
    : '';
  const imgHover = o.hover
    ? `<img class="hover" alt="" data-src="${esc(o.hover)}">` : '';
  const tag = o.tag ? `<span class="tag">${esc(o.tag)}</span>` : '';
  const meta = linkable
    ? `<span>${esc(o.cat||'설치가이드')}</span><span class="arrow">→</span>`
    : `<span>${esc(o.cat||'')}</span><span class="soon">준비중</span>`;
  return `<a class="card link" data-id="${o.id}">
    <div class="card-img">${imgBase}${imgHover}${tag}</div>
    <div class="body">
      <div class="brand">${esc(o.brand)}</div>
      <h3>${esc(o.name)}</h3>
      <div class="desc">${esc(o.desc)}</div>
    </div>
    <div class="meta">${meta}</div>
  </a>`;
}

function render(list){
  if(!list.length){ view.innerHTML = `<div class="center">검색 결과가 없습니다.</div>`; return; }
  // 브랜드별 그룹
  const byBrand = {};
  list.forEach(o=>{ (byBrand[o.brand||'기타'] ||= []).push(o); });
  const brands = Object.keys(byBrand).sort((a,b)=>a.localeCompare(b,'ko'));
  view.innerHTML = brands.map(b=>{
    const items = byBrand[b].sort((x,y)=>
      (Number(x.order||1e9)-Number(y.order||1e9)) || x.name.localeCompare(y.name,'ko'));
    return `<section>
      <div class="sec-head"><h2>${esc(b)}</h2><span class="count">${items.length}</span></div>
      <div class="grid">${items.map(cardHTML).join('')}</div>
    </section>`;
  }).join('');
  // hover 지연 로드 + 클릭 시 상세로
  view.querySelectorAll('.card').forEach(c=>{
    c.addEventListener('mouseenter',()=>{
      const h=c.querySelector('.hover[data-src]');
      if(h){ h.src=h.dataset.src; h.removeAttribute('data-src'); }
    },{once:true});
    c.addEventListener('click',()=>{ location.hash = 'a/'+c.dataset.id; });
  });
}

const CATMAP = {
  'SOFA':'소파', 'BED':'베드', 'TABLE':'다이닝테이블',
  'SIDE & SOFA TABLE':'사이드테이블 & 소파테이블', 'CHAIR':'체어', 'STORAGE':'수납장',
  'LEFF':'LEFF', 'ETC':'ETC'
};
let currentCat = '';     // '' = 전체 (카테고리)
let currentBrand = '';   // '' = 전체 (브랜드)

function currentList(){
  let list = rows;
  if(currentCat){ const ko = CATMAP[currentCat]; list = list.filter(o=>o.cat.trim()===ko); }
  if(currentBrand){ list = list.filter(o=>o.brand.trim()===currentBrand); }
  const q = document.getElementById('q').value.trim().toLowerCase();
  if(q){ const kw = q.split(/\s+/);
    list = list.filter(o=>{
      const hay = `${o.brand} ${o.cat} ${o.name} ${o.desc} ${o.ko1} ${o.ko2}`.toLowerCase();
      return kw.every(k=>hay.includes(k));
    });
  }
  return list;
}
function renderChip(){
  const fb = document.getElementById('filterbar');
  let h = '';
  if(currentCat)   h += `<button class="chip" data-clear="cat">${esc(currentCat)} &times;</button>`;
  if(currentBrand) h += `<button class="chip" data-clear="brand">${esc(currentBrand)} &times;</button>`;
  fb.innerHTML = h;
  fb.querySelectorAll('.chip').forEach(b=>b.onclick = ()=>{
    if(b.dataset.clear==='cat') selectCat(''); else selectBrand(currentBrand);
  });
}
function refresh(){
  const active = currentCat || currentBrand || document.getElementById('q').value.trim();
  if(active) render(currentList()); else renderLanding();
  renderChip();
}

const drawer = document.getElementById('drawer'), scrim = document.getElementById('scrim');
const openDrawer = ()=>{ drawer.classList.add('open'); scrim.classList.add('open'); };
const closeDrawer = ()=>{ drawer.classList.remove('open'); scrim.classList.remove('open'); };
document.getElementById('menuBtn').onclick = openDrawer;
document.getElementById('drawerClose').onclick = closeDrawer;
scrim.onclick = closeDrawer;
function markCat(){ drawer.querySelectorAll('a[data-cat]').forEach(a=>a.classList.toggle('active', a.dataset.cat===currentCat)); }
function markBrand(){ drawer.querySelectorAll('a[data-brand]').forEach(a=>a.classList.toggle('active', a.dataset.brand===currentBrand)); }
function selectCat(cat){ currentCat = cat; markCat(); closeDrawer(); goList(); window.scrollTo({top:0, behavior:'smooth'}); }
function selectBrand(brand){ currentBrand = (currentBrand===brand ? '' : brand); markBrand(); closeDrawer(); goList(); window.scrollTo({top:0, behavior:'smooth'}); }
drawer.querySelectorAll('a[data-cat]').forEach(a=>a.onclick = ()=>selectCat(a.dataset.cat));

// 홈(로고) → 첫 화면
document.getElementById('home').onclick = ()=>{
  document.getElementById('q').value='';
  currentCat=''; currentBrand=''; markCat(); markBrand();
  closeDrawer(); goList(); window.scrollTo({top:0, behavior:'smooth'});
};

// ===== 상세 페이지 라우팅 =====
const heroEl = document.querySelector('.hero');
const filterbarEl = document.getElementById('filterbar');
let byId = {};

function driveId(url){ const m=(url||'').match(/\/d\/([^/]+)/); return m ? m[1] : ''; }
function metaRow(v){
  const items=[['단계',v[0]],['소요',v[1]],['인원',v[2]],['공구',v[3]]].filter(x=>x[1]);
  return items.length ? `<div class="dmeta">`+items.map(x=>`<span><b>${x[0]}</b> ${esc(x[1])}</span>`).join('')+`</div>` : '';
}
function pdfEmbed(id){
  return id ? `<div class="pdfwrap"><iframe src="https://drive.google.com/file/d/${id}/preview" loading="lazy"></iframe></div>`
            : `<div class="center">설치가이드 준비중입니다.</div>`;
}
function sofaSVG(side){
  const arm = side==='L'
    ? `<rect x="6" y="24" width="22" height="74" rx="10" fill="#fff" stroke="#e0dacd"/>`
    : `<rect x="182" y="24" width="22" height="74" rx="10" fill="#fff" stroke="#e0dacd"/>`;
  return `<svg class="mod mod${side}" viewBox="0 0 210 130" xmlns="http://www.w3.org/2000/svg">
    <rect x="14" y="10" width="182" height="52" rx="12" fill="#fff" stroke="#e0dacd"/>
    <rect x="8" y="54" width="194" height="44" rx="14" fill="#fbfaf6" stroke="#e0dacd"/>
    <path d="M74 60V92 M140 60V92" stroke="#efe8d9" stroke-width="3"/>
    ${arm}
    <rect x="30" y="98" width="7" height="18" rx="1.5" fill="#2b2b2b"/>
    <rect x="173" y="98" width="7" height="18" rx="1.5" fill="#2b2b2b"/>
  </svg>`;
}
function bracketSVG(){
  return `<svg viewBox="0 0 90 54" width="76" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="mtl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eceef1"/><stop offset=".5" stop-color="#bcbfc6"/><stop offset="1" stop-color="#8f939b"/>
    </linearGradient></defs>
    <path d="M6 44V14h14v16h50V14h14v30Z" fill="url(#mtl)" stroke="#6f747c" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="13" cy="38" r="2.2" fill="#5c6068"/><circle cx="77" cy="38" r="2.2" fill="#5c6068"/>
  </svg>`;
}
function simHTML(sub){
  return `<div class="sim">
    <h3>설치 시뮬레이션</h3>
    ${sub?`<p class="subt">${esc(sub).replace(/\n/g,'<br>')}</p>`:''}
    <div class="sim-stage play" id="simStage">
      <div class="sim-label">① 두 모듈을 수평으로 맞댄 뒤 하단 하드웨어로 결합</div>
      ${sofaSVG('R')}
      ${sofaSVG('L')}
      <div class="brk">${bracketSVG()}<div class="cap">하드웨어 결합</div></div>
      <div class="glide">
        <svg class="gsvg" viewBox="0 0 44 56" xmlns="http://www.w3.org/2000/svg">
          <rect x="18" y="2" width="6" height="28" fill="#2b2b2b"/>
          <rect class="gfoot" x="13" y="30" width="16" height="8" rx="2" fill="#5c6068"/>
          <path d="M37 18 V40 M34 22 l3 -4 l3 4 M34 36 l3 4 l3 -4" stroke="#8a6d3b" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="cap">높이조절</div>
      </div>
    </div>
    <div class="sim-steps">
      <span><b>1.</b> 모듈 안착</span>
      <span><b>2.</b> 반대 모듈과 맞댄 뒤</span>
      <span><b>3.</b> 하부 하드웨어 체결</span>
      <span><b>4.</b> 하단글라이드로 높이조절</span>
    </div>
    <button class="btn ghost replay" id="simReplay">▶ 다시 재생</button>
  </div>`;
}
// ===== 모듈 구성 가이드 (TARTAN) =====
const TARTAN_MODULES = [
  {name:'암레스트 좌/우', sub:'암레스트', mods:['armL']},
  {name:'암레스트 라운지', sub:'라운지', mods:['lounge']},
  {name:'미들', sub:'미들', mods:['mid']},
  {name:'소파 3인 좌형', sub:'암레스트 좌형 · 미들', mods:['armL','mid']},
  {name:'소파 3인 우형', sub:'미들 · 암레스트 우형', mods:['mid','armR']},
  {name:'소파 3인 코너 좌형', sub:'암레스트 우형 ×2', mods:['armR','armR']},
  {name:'소파 3인 코너 우형', sub:'암레스트 좌형 ×2', mods:['armL','armL']},
  {name:'소파 3인 B 좌형', sub:'코너 · 암레스트 좌형', mods:['corner','armL']},
  {name:'소파 3인 B 우형', sub:'암레스트 우형 · 코너', mods:['armR','corner']},
  {name:'소파 4인 A', sub:'암레스트 좌형 · 암레스트 우형', mods:['armL','armR']},
  {name:'소파 4인 B', sub:'암레스트 라운지 ×2', mods:['lounge','lounge']},
  {name:'소파 4인 코너 A 좌형', sub:'암레스트 좌형 · 암레스트 라운지', mods:['armL','lounge']},
  {name:'소파 4인 코너 A 우형', sub:'암레스트 라운지 · 암레스트 우형', mods:['lounge','armR']},
  {name:'소파 4인 코너 B 좌형', sub:'암레스트 우형 ×2 · 미들', mods:['armR','armR','mid']},
  {name:'소파 4인 코너 B 우형', sub:'암레스트 좌형 ×2 · 미들', mods:['armL','armL','mid']},
  {name:'소파 5인', sub:'암레스트 좌형 · 미들 · 암레스트 우형', mods:['armL','mid','armR']},
  {name:'쿠션 S / L', sub:'쿠션', mods:['cushion']}
];
// 모듈 폭(방석 넓이 차이): 코너=좁게, 암레스트=중간, 라운지=넓게
const MW = {mid:112, armL:120, armR:120, corner:96, lounge:152, cushion:84};
function mPartX(x,key,w,side){
  const C='#efe7da', L='#d8cfbe', K='#2b2b2b';
  const g=s=>`<g transform="translate(${x},0)">${s}</g>`;
  if(key==='cushion') return g(`<rect x="${(w-64)/2}" y="32" width="64" height="60" rx="12" fill="${C}" stroke="${L}"/>`);
  const a=20, hasL=side==='L', hasR=side==='R', low=key==='lounge';
  const inX = hasL? a:3, inR = hasR? w-a : w-3, inW = inR-inX;
  const backY = low?42:20, backH = low?22:42;
  const back = `<rect x="${inX+3}" y="${backY}" width="${inW-6}" height="${backH}" rx="10" fill="${C}" stroke="${L}"/>`;
  const seatY = low?56:56, seatH = low?48:40;
  const seat = `<rect x="${inX-1}" y="${seatY}" width="${inW+2}" height="${seatH}" rx="12" fill="${C}" stroke="${L}"/>`;
  const arm = hasL? `<rect x="3" y="30" width="${a-3}" height="66" rx="9" fill="${C}" stroke="${L}"/>`
            : hasR? `<rect x="${w-a}" y="30" width="${a-3}" height="66" rx="9" fill="${C}" stroke="${L}"/>` : '';
  const legY = seatY+seatH, lx1=inX+8, lx2=inR-14;
  const legs = `<rect x="${lx1}" y="${legY}" width="6" height="14" rx="1.5" fill="${K}"/><rect x="${lx2}" y="${legY}" width="6" height="14" rx="1.5" fill="${K}"/>`;
  return g(back+seat+arm+legs);
}
function composeModules(mods){
  let x=0; const parts=[];
  mods.forEach((k,i)=>{
    const side = k==='armL'?'L' : k==='armR'?'R' : (k==='mid'||k==='cushion')?'none'
               : (i===mods.length-1 && i!==0 ? 'R':'L');  // 코너·라운지: 바깥쪽 팔걸이
    const w = MW[k]||112;
    parts.push(mPartX(x,k,w,side));
    x += w;
  });
  return `<svg viewBox="0 0 ${x} 118" class="mg-svg" xmlns="http://www.w3.org/2000/svg">${parts.join('')}</svg>`;
}
function moduleGuideHTML(){
  return `<div class="modguide">
    <h3>모듈 구성</h3>
    <p class="subt">제품별 구성 모듈 리스트 (×2 = 해당 모듈 2개)</p>
    <div class="mg-grid">
      ${TARTAN_MODULES.map(m=>`<div class="mg-card">
        <div class="mg-img">${composeModules(m.mods)}</div>
        <div class="mg-name">${esc(m.name)}</div>
        <div class="mg-sub">${esc(m.sub)}</div>
      </div>`).join('')}
    </div>
  </div>`;
}

// ===== FAQ =====
function toFaq(grid){
  if(!grid.length) return [];
  const head=grid[0];
  // 헤더 셀에 목록이 덧붙어 있어도(예: "브랜드 매직볼트 …") 라벨로 시작하면 인식
  const clean=h=>(h||'').replace(/\s/g,'').toLowerCase();
  const idx=n=>head.findIndex(h=>clean(h).startsWith(n.toLowerCase()));
  const c={brand:idx('브랜드'), art:idx('아티클'), q:idx('질문'), a:idx('답변'), order:idx('순서')};
  const g=(r,k)=> c[k]>=0 ? (r[c[k]]||'').trim() : '';
  return grid.slice(1).map(r=>({brand:g(r,'brand'), article:g(r,'art'), q:g(r,'q'), a:g(r,'a'), order:g(r,'order')})).filter(f=>f.q);
}
function faqHTML(o){
  const nz=s=>(s||'').replace(/\s/g,'').toLowerCase();
  const list=faqRows.filter(f=> nz(f.article) && nz(f.brand)===nz(o.brand) && nz(o.name).includes(nz(f.article)))
    .sort((a,b)=>(Number(a.order||1e9))-(Number(b.order||1e9)));
  if(!list.length) return '';
  return `<div class="faq"><h3>자주 하는 질문 (FAQ)</h3>`+
    list.map(f=>`<details class="faq-item"><summary>${esc(f.q)}</summary><div class="faq-a">${fmtBody(f.a)}</div></details>`).join('')+
    `</div>`;
}

function detailHTML(o){
  const isTartan = o.name.toUpperCase().includes('TARTAN');
  const id = driveId(o.link);
  const pdfBtn = o.link
    ? `<a class="btn dark" href="${esc(o.link)}" target="_blank" rel="noopener">📄 원본 PDF</a>`
    : `<span class="btn dark disabled">준비중</span>`;
  const chip = o.tag ? esc(o.tag) : esc(`${o.brand} · ${o.cat}`);
  const meta = metaRow([o.step,o.time,o.people,o.tool]);
  const body = isTartan ? (simHTML(o.simdesc)+faqHTML(o)+moduleGuideHTML()) : (pdfEmbed(id)+faqHTML(o));
  return `<div class="detail">
    <nav class="crumb"><a data-home>설치가이드</a><i>›</i><a data-cbrand>${esc(o.brand)}</a><i>›</i><span>${esc(o.name)}</span></nav>
    <div class="dchip">${chip}</div>
    <h1 class="dtitle">${esc(o.name)}</h1>
    ${(o.detail||o.desc)?`<div class="ddesc">${fmtBody(o.detail||o.desc)}</div>`:''}
    ${meta}
    <div class="dbtns">${pdfBtn}</div>
    <hr class="drule">
    ${body}
    <div class="dback"><button class="btn ghost" data-back>← 목록으로</button></div>
  </div>`;
}
function wireDetail(o){
  view.querySelector('[data-home]')?.addEventListener('click', ()=>{ location.hash=''; });
  view.querySelector('[data-cbrand]')?.addEventListener('click', ()=>selectBrand(o.brand));
  view.querySelector('[data-back]')?.addEventListener('click', ()=>{ location.hash=''; });
  const rep=view.querySelector('#simReplay'), stage=view.querySelector('#simStage');
  if(rep && stage) rep.onclick=()=>{ stage.classList.remove('play'); void stage.offsetWidth; stage.classList.add('play'); };
}
function showList(){ heroEl.hidden=false; filterbarEl.hidden=false; refresh(); }
function showDetail(o){ heroEl.hidden=true; filterbarEl.hidden=true; view.innerHTML=detailHTML(o); wireDetail(o); window.scrollTo({top:0}); }
function goList(){ if(location.hash) location.hash=''; else showList(); }
function route(){ const m=(location.hash||'').match(/^#a\/(\d+)/); if(m && byId[m[1]]) showDetail(byId[m[1]]); else showList(); }
window.addEventListener('hashchange', route);

document.getElementById('q').addEventListener('input', refresh);

fetch(CSV_URL)
  .then(r=>{ if(!r.ok) throw new Error(r.status); return r.text(); })
  .then(t=>{
    rows = toObjects(parseCSV(t));
    byId = {}; rows.forEach(o=>byId[o.id]=o);
    // 카테고리별 수량
    drawer.querySelectorAll('a[data-cat]').forEach(a=>{
      const cat = a.dataset.cat;
      const n = cat ? rows.filter(o=>o.cat.trim()===CATMAP[cat]).length : rows.length;
      a.insertAdjacentHTML('beforeend', `<span class="n">${n}</span>`);
    });
    // 브랜드 목록 (가나다·ABC 순) — 카테고리 위에 표시
    const bcount = {};
    rows.forEach(o=>{ const b=o.brand.trim(); if(b) bcount[b]=(bcount[b]||0)+1; });
    const brands = Object.keys(bcount).sort((a,b)=>a.localeCompare(b,'ko'));
    document.getElementById('brandSection').innerHTML = `<h4>브랜드</h4>` +
      brands.map(b=>`<a data-brand="${esc(b)}">${esc(b)}<span class="n">${bcount[b]}</span></a>`).join('');
    drawer.querySelectorAll('a[data-brand]').forEach(a=>a.onclick = ()=>selectBrand(a.dataset.brand));
    // FAQ 탭 로드 후 라우팅
    fetch(csvUrl(FAQ_TAB)).then(r=>r.ok?r.text():'').then(ft=>{ if(ft) faqRows=toFaq(parseCSV(ft)); }).catch(()=>{}).finally(route);
  })
  .catch(e=>{ view.innerHTML = `<div class="center">불러오지 못했습니다. 시트 공유 설정(링크가 있는 모든 사용자·보기)과 탭 이름 '${esc(CATALOG_TAB)}'을 확인해 주세요.<br><small>${esc(String(e))}</small></div>`; });
</script>
